# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

minecraft_version=1.20.1
forge_version=47.1.47

# Mod metadata
mod_id=hexcessible
mod_name=Hexcessible
# Naming convention: hexcessible-forge-<ver>f<build>.jar, e.g. 0.3.1f1
mod_version=0.3.1f1
maven_group=dev.tizu.hexcessible
archives_base_name=hexcessible-forge

# Dependencies
# Hex Casting Forge -- same 0.11.x line as the Fabric build (source reference: HexMod-main, 0.11.4)
hexcasting_version=0.11.4
patchouli_version=84
cloth_config_version=11.1.118
paucal_version=0.6.0-pre-118
inline_version=1.2.2
caelus_version=3.1.0+1.20

# Kotlin stdlib is used for kotlin.Pair in DrawState; provided at runtime by Kotlin for Forge
kotlin_version=1.9.10
kotlinforforge_version=4.12.0
